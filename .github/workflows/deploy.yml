name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/workspace/projects/monolith
            docker compose pull portofolio-kirani
            docker compose up -d --no-deps --force-recreate portofolio-kirani
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -fsS http://localhost:3007/api/health; then
                echo "Portfolio service is running."
                exit 0
              fi
              echo "Waiting for Portfolio service to start..."
              sleep 5
            done
            echo "Portfolio service failed to start."
            docker compose logs --tail=50 portofolio-kirani
            exit 1
